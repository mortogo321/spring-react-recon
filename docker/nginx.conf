# Serves the console bundle and proxies the API, so the browser only ever talks to one origin.
# No CORS, no preflight, no third-party cookie question — the class of problem that arrangement
# avoids is worth more than the one extra hop.

upstream recon_api {
    # The compose service name. Re-resolved on reload, which is what matters when the API
    # container is replaced and comes back on a new address.
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is served over http here and terminated by whatever sits in front in a real
    # deployment; these are the headers that do not depend on that.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The console loads no third-party script, style or font, so the policy can be this tight.
    # 'unsafe-inline' for style-src is Emotion injecting the MUI styles at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml application/manifest+json;

    # Hashed asset filenames, so they can be cached hard and for ever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the file that names the current asset hashes, and a
    # stale copy points a returning user at a bundle that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://recon_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The console generates one per request; forwarding it is what ties a screenshot to a log line.
        proxy_set_header X-Correlation-Id $http_x_correlation_id;

        # A reconciliation launch returns immediately, but a cold JDBC pool against Oracle can
        # take a few seconds on the first call after a deploy.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Read-only operational endpoints, useful behind the same origin during a demo.
    location /actuator/ {
        proxy_pass http://recon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://recon_api;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://recon_api;
        proxy_set_header Host $host;
    }

    # Client-side routing: every unknown path is a console route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
