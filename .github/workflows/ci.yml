# Three jobs, deliberately separate.
#
# `backend` and `frontend` are pure unit/integration work and have nothing to say to each other, so
# they run at the same time. `e2e` needs both halves built and is the slowest, so it starts the API
# as its own step: a boot failure then shows up as a red step with the API's log next to it rather
# than as six identical Playwright timeouts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant. Not applied to main, where every
# commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '26'
  BUN_VERSION: '1.4.0'

jobs:
  backend:
    name: Backend — build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the shared cache; a PR reads it. Otherwise a branch can poison the
          # cache every other branch then reads.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` runs spotlessCheck, the ArchUnit rules, the unit tests, both @SpringBootTest
      # integration tests and the Jacoco floor. One command, so CI cannot drift from what a
      # developer runs locally.
      - run: ./gradlew build --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend/*/build/reports/tests/test
            backend/*/build/test-results/test
            backend/*/build/reports/jacoco
          retention-days: 7

  frontend:
    name: Frontend — typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # --frozen-lockfile, so a dependency added without committing the lockfile fails here rather
      # than resolving to something different in the image build.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  e2e:
    name: E2E — the maker-checker journey in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install console dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      # The local profile, so the whole suite runs on two in-memory databases and needs neither
      # Oracle nor MySQL. Backgrounded with its log on disk: the last step prints it on failure.
      - name: Start the API
        run: |
          ./gradlew :backend:recon-api:bootJar
          nohup java -jar backend/recon-api/build/libs/recon-api.jar \
            --spring.profiles.active=local > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become ready"; cat api.log; exit 1

      # playwright.config.ts builds the bundle and serves it with `vite preview` on 4173, so the
      # specs drive the artefact that ships rather than the dev server's transformed modules.
      - name: Run the suite
        working-directory: frontend
        run: bunx playwright test

      - name: API log
        if: failure()
        run: cat api.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
